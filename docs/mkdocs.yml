site_name: cl-http-kit
site_description: A portable, binary-safe HTTP client substrate.
site_url: https://nerima-lisp.github.io/cl-http-kit/
repo_url: https://github.com/nerima-lisp/cl-http-kit
repo_name: nerima-lisp/cl-http-kit
edit_uri: edit/main/docs/src/

docs_dir: src
site_dir: ../site
use_directory_urls: true
copyright: MIT License

strict: true

theme:
  name: material
  language: en
  favicon: assets/favicon.svg

plugins:
  - search

not_in_nav: |
  notes/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Core Concepts: guide/core-concepts.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Conditions: reference/conditions.md
      - Compatibility: reference/compatibility.md
  - Project:
      - Development: project/development.md
      - Changelog: project/changelog.md
      - Migration guide: project/migration.md
